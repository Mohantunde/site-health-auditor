[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-health-auditor"
version = "0.1.0"
description = "Audit availability and basic SEO health across multiple websites."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Site Health Auditor contributors"}]
dependencies = [
  "beautifulsoup4==4.13.4",
  "PyYAML==6.0.2",
  "requests==2.32.4"
]

[project.scripts]
site-health-auditor = "site_health_auditor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
